name: 每日抓取 & 部署质标雷达

on:
  schedule:
    # 北京时间每天 06:00 自动抓取（UTC 22:00 前一日）
    - cron: '0 22 * * *'
  workflow_dispatch: {}
  push:
    branches: [main, master]

# 允许 Actions 部署到 GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 抓取最新权威情报
        # 单源失败不影响整体：失败保留上次快照，绝不产出空数据集
        run: npm run crawl
        continue-on-error: true

      - name: 构建静态站点
        env:
          # GitHub Pages 子路径部署：base 自动设为 /<仓库名>/
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
