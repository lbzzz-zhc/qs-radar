<!doctype html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>质标雷达 QS-Radar · 质量与标准化选题中央处理器</title>
    <meta
      name="description"
      content="面向「质量与标准化」科普自媒体团队的 AI 选题中央处理器：权威信源追踪 → 五维可信度评判 → 选题方向策划 → 内容生产辅助。"
    />
    <meta name="theme-color" content="#0b0e14" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='none' stroke='%232f81f7' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%232f81f7' stroke-width='2' opacity='.6'/%3E%3Ccircle cx='16' cy='16' r='2.5' fill='%232f81f7'/%3E%3C/svg%3E" />
    <script>
      // 主题防闪烁：在首屏渲染前同步决定 class，避免白屏闪烁
      (function () {
        try {
          var saved = localStorage.getItem('qsr-theme') || 'system'
          var isDark =
            saved === 'dark' ||
            (saved === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', isDark)
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
